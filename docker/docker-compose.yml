name: acuba

# Environnement de développement local.
# Aucune valeur de ce fichier n'est utilisée hors du poste du développeur : les mots de
# passe ci-dessous sont volontairement triviaux et ne doivent JAMAIS être réutilisés
# ailleurs (SECURITY.md §7).

services:
  postgres:
    image: postgres:16-alpine
    container_name: acuba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acuba
      POSTGRES_PASSWORD: acuba_local_dev
      POSTGRES_DB: acuba
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crée les deux schémas et le rôle KYC séparé (ADR-004).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acuba -d acuba']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acuba-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: acuba-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: acuba_local
      MINIO_ROOT_PASSWORD: acuba_local_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée les DEUX buckets séparés, tous deux privés. Le bucket KYC n'est jamais
  # accessible publiquement, même en développement.
  minio-init:
    image: minio/mc:latest
    container_name: acuba-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 acuba_local acuba_local_dev &&
      mc mb --ignore-existing local/acuba-media &&
      mc mb --ignore-existing local/acuba-kyc &&
      mc anonymous set none local/acuba-media &&
      mc anonymous set none local/acuba-kyc &&
      echo 'Buckets media et kyc prêts (tous deux privés).'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: acuba-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  redis-data:
  minio-data:
