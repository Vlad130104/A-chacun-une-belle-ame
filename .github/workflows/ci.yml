name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  qualite:
    name: Lint, typage et format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:unit

  tests-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acuba
          POSTGRES_PASSWORD: acuba_ci
          POSTGRES_DB: acuba_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acuba" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://acuba:acuba_ci@localhost:5432/acuba_test?schema=app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm test:int

  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  contrats:
    name: Schéma et spécification
    runs-on: ubuntu-latest
    env:
      # `prisma validate` résout env("DATABASE_URL") : une valeur factice suffit,
      # aucune connexion n'est ouverte.
      DATABASE_URL: postgresql://validation:validation@localhost:5432/validation?schema=app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le schéma Prisma et la spécification OpenAPI sont des contrats : ils doivent
      # rester valides à chaque commit.
      - run: pnpm db:validate
      - run: pnpm api:openapi:lint

  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret retiré du dernier commit reste exposé
          # s'il subsiste dans l'historique (SECURITY.md §7).
          fetch-depth: 0
      - name: Recherche de secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit des dépendances
        run: pnpm audit --audit-level high

  # TODO(D1-11): ajouter les jobs `test:e2e` (Playwright, 18 parcours) et `perf`
  # (Lighthouse CI) dès que les premières tranches verticales exposent des parcours
  # complets — voir docs/09-plan-de-tests.md §9.
